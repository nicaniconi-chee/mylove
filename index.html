<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A little purple corner of the world to celebrate five lovely months together."
    />
    <meta name="theme-color" content="#21132f" />
    <title>Five lovely months · for my love</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell greeting-shell">
      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>
      <div class="sparkles" aria-hidden="true">
        <span>✦</span><span>·</span><span>✧</span><span>·</span><span>✦</span>
        <span>·</span><span>✧</span><span>·</span><span>✦</span>
      </div>

      <section class="greeting-card" aria-labelledby="greeting-title">
        <p class="eyebrow"><span class="eyebrow-line"></span> a little celebration <span class="eyebrow-line"></span></p>
        <div class="moon-mark" aria-hidden="true"><span>♡</span></div>
        <p class="month-count">five months of us</p>
        <h1 id="greeting-title">Happy 5th<br /><em>Monthsary,</em><br />my love</h1>
        <p class="greeting-copy">
          Five little months, a million favorite moments.<br class="desktop-break" />
          I’m so happy it’s you.
        </p>
        <a class="button button-primary" href="flowers.html">
          <span>There’s something for you</span>
          <span class="button-arrow" aria-hidden="true">→</span>
        </a>
        <p class="card-footnote">made with all my love <span aria-hidden="true">♡</span></p>
      </section>

      <p class="page-caption">for my favorite person, always</p>
    </main>
  </body>
</html>
